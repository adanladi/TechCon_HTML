<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register for TechCon 2024 | Technology Conference</title>
</head>
<body>
    <!-- Header section containing conference branding and navigation -->
    <header>
        <div class="logo">
            <h1>TechCon 2024</h1>
        </div>
        
        <!-- Main navigation menu -->
        <nav aria-label="Main navigation">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="schedule.html">Schedule</a></li>
                <li><a href="register.html" class="current">Register</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Skip navigation link for accessibility -->
    <div class="skip-nav">
        <a href="#main-content" class="sr-only sr-only-focusable">Skip to main content</a>
    </div>

    <!-- Main content section -->
    <main id="main-content">
        <!-- Page title -->
        <h1>Register for TechCon 2024</h1>

        <!-- Registration form with accessibility features -->
        <form id="registration-form" method="post" action="/register">
            <!-- Name field section -->
            <div class="form-group">
                <label for="full-name" class="required">Full Name:</label>
                <input type="text" 
                       id="full-name" 
                       name="full-name" 
                       required 
                       aria-required="true"
                       placeholder="Enter your full name">
            </div>

            <!-- Email field section -->
            <div class="form-group">
                <label for="email" class="required">Email Address:</label>
                <input type="email" 
                       id="email" 
                       name="email" 
                       required 
                       aria-required="true"
                       placeholder="your.email@example.com">
            </div>

            <!-- Password field section -->
            <div class="form-group">
                <label for="password" class="required">Password:</label>
                <input type="password" 
                       id="password" 
                       name="password" 
                       required 
                       aria-required="true"
                       minlength="8"
                       placeholder="Create a strong password">
            </div>

            <!-- Password confirmation field section -->
            <div class="form-group">
                <label for="confirm-password" class="required">Confirm Password:</label>
                <input type="password" 
                       id="confirm-password" 
                       name="confirm-password" 
                       required 
                       aria-required="true"
                       placeholder="Confirm your password">
            </div>

            <!-- Terms and Conditions section -->
            <div class="form-group terms">
                <input type="checkbox" 
                       id="terms" 
                       name="terms" 
                       required 
                       aria-required="true">
                <label for="terms" class="required">
                    I agree to the <a href="terms.html" target="_blank" rel="noopener noreferrer">Terms and Conditions</a>
                </label>
            </div>

            <!-- Submit button -->
            <button type="submit" class="submit-button">
                Register Now
            </button>
        </form>
    </main>

    <!-- Footer section with copyright information -->
    <footer>
        <p>&copy; 2024 TechCon. All rights reserved.</p>
    </footer>
</body>
</html>
