<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | TechCon 2024</title>
</head>
<body>
    <!-- Header section containing conference branding and navigation -->
    <header>
        <div class="logo">
            <h1>TechCon 2024</h1>
        </div>
        
        <!-- Main navigation menu -->
        <nav aria-label="Main navigation">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="schedule.html">Schedule</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="contact.html" class="current">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Skip navigation link for accessibility -->
    <div class="skip-nav">
        <a href="#main-content" class="sr-only sr-only-focusable">Skip to main content</a>
    </div>

    <!-- Main content section -->
    <main id="main-content">
        <!-- Page title -->
        <h1>Contact Us</h1>

        <!-- Contact information section -->
        <section id="contact-info" class="contact-section">
            <h2>Get in Touch</h2>
            
            <!-- Email contact -->
            <div class="contact-method">
                <h3>Email Us</h3>
                <a href="mailto:email@example.com" class="email-link">
                    email@example.com
                </a>
            </div>

            <!-- Social media links -->
            <div class="social-links">
                <h3>Follow Us</h3>
                <ul>
                    <li>
                        <a href="https://twitter.com/techcon2024" 
                           target="_blank" 
                           rel="noopener noreferrer"
                           aria-label="Follow us on Twitter">
                            Twitter
                        </a>
                    </li>
                    <li>
                        <a href="https://linkedin.com/company/techcon2024" 
                           target="_blank" 
                           rel="noopener noreferrer"
                           aria-label="Connect with us on LinkedIn">
                            LinkedIn
                        </a>
                    </li>
                    <li>
                        <a href="https://facebook.com/techcon2024" 
                           target="_blank" 
                           rel="noopener noreferrer"
                           aria-label="Like us on Facebook">
                            Facebook
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Embedded Google Maps -->
            <div class="map-container">
                <h3>Conference Venue</h3>
                <iframe 
                    src="https://www.google.com/maps/embed?pb=your-embed-code-here" 
                    width="100%" 
                    height="400" 
                    frameborder="0" 
                    style="border:0" 
                    allowfullscreen 
                    aria-label="TechCon 2024 Venue Location">
                </iframe>
            </div>
        </section>

        <!-- Contact form section -->
        <section id="contact-form" class="contact-section">
            <h2>Send Us a Message</h2>
            
            <!-- Contact form with accessibility features -->
            <form id="contact-form" method="post" action="/contact">
                <!-- Name field section -->
                <div class="form-group">
                    <label for="full-name" class="required">Full Name:</label>
                    <input type="text" 
                           id="full-name" 
                           name="full-name" 
                           required 
                           aria-required="true"
                           placeholder="Enter your full name">
                </div>

                <!-- Email field section -->
                <div class="form-group">
                    <label for="email" class="required">Email Address:</label>
                    <input type="email" 
                           id="email" 
                           name="email" 
                           required 
                           aria-required="true"
                           placeholder="your.email@example.com">
                </div>

                <!-- Message field section -->
                <div class="form-group">
                    <label for="message" class="required">Message:</label>
                    <textarea id="message" 
                             name="message" 
                             required 
                             aria-required="true"
                             placeholder="Type your message here..."
                             rows="5"></textarea>
                </div>

                <!-- Submit button -->
                <button type="submit" class="submit-button">
                    Send Message
                </button>
            </form>
        </section>
    </main>

    <!-- Footer section with copyright information -->
    <footer>
        <p>&copy; 2024 TechCon. All rights reserved.</p>
    </footer>
</body>
</html>
